<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bluxury Outreach</title>
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2310b981'/%3E%3Cpath d='M23 9 13.5 18.5M23 9l-6 15-3.5-5.5L7 15z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Sign in -->
  <main id="login" class="login" hidden>
    <form id="login-form" class="card login-card">
      <div class="brand"><span class="brand-mark" data-icon="send"></span><span>Bluxury Outreach</span></div>
      <p class="muted">WhatsApp outreach to the leads from your lead finder. The AI suggests, you choose.</p>
      <label class="field"><span>Admin key</span><input id="api-key" class="input" type="password" autocomplete="current-password" required /></label>
      <button type="submit" class="btn primary">Sign in</button>
      <p id="login-error" class="form-error" role="alert"></p>
    </form>
  </main>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-mark" data-icon="send"></span><span>Bluxury Outreach</span></div>
      <span id="won" class="pill best" hidden></span>
      <span class="spacer"></span>
      <label class="btn primary">
        <span data-icon="upload"></span><span class="hide-sm">Import leads CSV</span>
        <input type="file" id="csv-file" accept=".csv,text/csv" hidden />
      </label>
      <button class="btn" id="setup-btn"><span data-icon="sliders"></span><span class="hide-sm">Setup</span></button>
      <button class="btn icon ghost" id="theme-btn" title="Switch theme" aria-label="Switch theme"></button>
      <button class="btn icon ghost" id="logout" title="Sign out" aria-label="Sign out" data-icon="logout"></button>
    </header>
    <main class="page">
      <div id="setup-banner"></div>
      <div class="filters" id="tabs"></div>
      <div class="layout">
        <section class="card list-card">
          <div class="search"><span data-icon="search"></span><input class="input" id="search" placeholder="Search business or number" /></div>
          <div id="list" class="list"></div>
        </section>
        <section class="card" id="detail"></section>
      </div>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
